
name: iOS Source Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Sources/**"
      - ".github/workflows/ios.yml"

jobs:
  validate:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Swift source
        run: test -f Sources/ContentView.swift

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check Swift syntax
        run: swiftc -frontend -parse Sources/ContentView.swift
